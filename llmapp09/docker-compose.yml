services:
  llm-multiroute:
    build: ./llm-multiroute
    image: llm-multiroute:workshop
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_MODEL_CLASSIFY=${OLLAMA_MODEL_CLASSIFY:-gemma4:31b}
      - OLLAMA_MODEL_SENTIMENT=${OLLAMA_MODEL_SENTIMENT:-glm-5.2}
      - OLLAMA_MODEL_SUMMARIZE=${OLLAMA_MODEL_SUMMARIZE:-mistral-large-3:675b}
      - OLLAMA_MODEL_INTENT=${OLLAMA_MODEL_INTENT:-minimax-m3}
      - SERVER_PORT=8080
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - llm-metrics:/app/metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/ai/routes')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - llm-network

  llm-frontend-python:
    build: ./llm-frontend-python
    image: llm-frontend-python:workshop
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://llm-multiroute:8080
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
    depends_on:
      llm-multiroute:
        condition: service_healthy
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  llm-metrics:
