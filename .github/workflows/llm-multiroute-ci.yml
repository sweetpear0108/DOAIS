name: LLM Multiroute CI

on:
  push:
    branches: [main, master]
    paths:
      - 'llmapp09/llm-multiroute/**'
      - '.github/workflows/llm-multiroute-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'llmapp09/llm-multiroute/**'
      - '.github/workflows/llm-multiroute-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: llmapp09/llm-multiroute

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: llmapp09/llm-multiroute/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check --isolated app tests

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: llmapp09/llm-multiroute/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          OTEL_SDK_DISABLED: "true"
          LANGFUSE_TRACING_ENABLED: "false"
          GUARDRAILS_ENABLE_METRICS: "false"
        run: pytest tests/ -v --tb=short

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: llmapp09/llm-multiroute
          load: true
          tags: llm-multiroute:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: llm-multiroute:scan
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Check Docker Hub configuration
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Set repository variable DOCKERHUB_USERNAME."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Set repository secret DOCKERHUB_TOKEN."; exit 1; }

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned image
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/llm-multiroute
        run: |
          docker tag llm-multiroute:scan "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag llm-multiroute:scan "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
